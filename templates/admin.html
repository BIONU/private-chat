<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>แอดมินแชท</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f2f5; }
  #sidebar { width: 260px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; }
  #sidebar h3 { padding: 16px; margin: 0; background: #0084ff; color: #fff; }
  .friend { padding: 14px 16px; cursor: pointer; border-bottom: 1px solid #eee; }
  .friend:hover { background: #f5f5f5; }
  .friend.active { background: #e7f3ff; font-weight: bold; }
  #main { flex: 1; display: flex; flex-direction: column; background: #fff; }
  #header { padding: 14px 16px; background: #0084ff; color: #fff; font-weight: bold; }
  #messages { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { margin: 6px 0; padding: 8px 12px; border-radius: 12px; max-width: 70%;
         word-wrap: break-word; }
  .me { background: #0084ff; color: #fff; margin-left: auto; }
  .them { background: #e4e6eb; color: #000; }
  #inputbar { display: flex; padding: 8px; border-top: 1px solid #ddd; }
  #inputbar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px;
                    font-size: 15px; outline: none; }
  #inputbar button { margin-left: 8px; padding: 10px 18px; border: 0;
                     background: #0084ff; color: #fff; border-radius: 20px; cursor: pointer; }
  #inputbar input:disabled, #inputbar button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<div id="sidebar">
  <h3>เพื่อนออนไลน์ (<span id="count">0</span>)</h3>
  <div id="friendList"></div>
</div>

<div id="main">
  <div id="header">เลือกเพื่อนทางซ้ายเพื่อเริ่มคุย</div>
  <div id="messages"></div>
  <div id="inputbar">
    <input id="msgInput" placeholder="พิมพ์ข้อความ..." disabled autocomplete="off">
    <button id="sendBtn" onclick="sendMsg()" disabled>ส่ง</button>
  </div>
</div>

<script>
const socket = io();
let currentSid = null;
let currentName = '';
const convos = {};   // { sid: [ {text, cls}, ... ] }

socket.emit('admin_join');

socket.on('friend_list', list => {
  const box = document.getElementById('friendList');
  box.innerHTML = '';
  document.getElementById('count').textContent = list.length;

  list.forEach(f => {
    // ใช้ sid เป็น key แต่แสดงชื่อ (sid มาจากฝั่ง server ส่งมาเป็น string เสมอ)
    // หมายเหตุ: friend_list ส่ง dict {name: ...} ไม่มี sid — ดูวิธีแก้ด้านล่าง
  });

</script>

<!-- 
  ⚠️ ด้านบน friend_list ปกติส่ง list ของ dict ที่มี key name เท่านั้น
  ต้องปรับ server ให้ส่ง sid ด้วย — ดูโค้ดเต็มด้านล่าง
-->

<script>
// --- โค้ดเต็มด้านล่างนี้ใช้แทนด้านบน ---
</script>

<script>
const socket2 = io();
let curSid = null;
let curName = '';
const store = {};  // { sid: { name, msgs: [] } }

socket2.emit('admin_join');

socket2.on('friend_list', list => {
  const box = document.getElementById('friendList');
  box.innerHTML = '';
  document.getElementById('count').textContent = list.length;

  list.forEach(f => {
    const div = document.createElement('div');
    div.className = 'friend' + (f.sid === curSid ? ' active' : '');
    div.textContent = f.name;
    div.onclick = () => selectFriend(f.sid, f.name);
    box.appendChild(div);
  });
});

socket2.on('incoming', d => {
  if (!store[d.sid]) store[d.sid] = { name: d.name, msgs: [] };
  store[d.sid].msgs.push({ text: d.msg, cls: 'them' });
  if (curSid === d.sid) addMsg(d.msg, 'them');
  else {
    // ไฮไลต์ว่าเพื่อนคนนี้ส่งข้อความมา
    const items = document.querySelectorAll('.friend');
    items.forEach(el => { if (el.textContent === d.name) el.style.fontWeight = 'bold'; });
  }
});

function selectFriend(sid, name) {
  curSid = sid; curName = name;
  document.getElementById('header').textContent = '💬 ' + name;
  document.getElementById('msgInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;

  // แสดงประวัติของเพื่อนคนนี้
  const box = document.getElementById('messages');
  box.innerHTML = '';
  (store[sid]?.msgs || []).forEach(m => addMsg(m.text, m.cls));

  // ไฮไลต์ในรายการ
  document.querySelectorAll('.friend').forEach(el => {
    el.classList.toggle('active', el.textContent === name);
  });
  document.getElementById('msgInput').focus();
}

function addMsg(text, cls) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  if (!curSid) return;
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg) return;
  socket2.emit('admin_message', { sid: curSid, msg });
  addMsg(msg, 'me');
  if (!store[curSid]) store[curSid] = { name: curName, msgs: [] };
  store[curSid].msgs.push({ text: msg, cls: 'me' });
  input.value = '';
  input.focus();
}

document.getElementById('msgInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') sendMsg();
});
</script>

</body>
</html>
