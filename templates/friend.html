<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แชทกับแอดมิน</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; background: #f0f2f5; }
  #login { max-width: 320px; margin: 80px auto; padding: 24px; background: #fff;
           border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); text-align: center; }
  #login input { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box;
                 margin: 12px 0; border: 1px solid #ccc; border-radius: 8px; }
  #login button { width: 100%; padding: 12px; font-size: 16px; background: #0084ff;
                  color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
  #chat { display: none; max-width: 500px; margin: 0 auto; height: 100vh;
          flex-direction: column; background: #fff; }
  #header { padding: 12px; background: #0084ff; color: #fff; font-weight: bold; }
  #messages { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { margin: 6px 0; padding: 8px 12px; border-radius: 12px; max-width: 75%;
         word-wrap: break-word; }
  .me { background: #0084ff; color: #fff; margin-left: auto; }
  .them { background: #e4e6eb; color: #000; }
  .msg img { max-width: 100%; border-radius: 8px; display: block; margin-top: 4px; }
  .sys { text-align: center; color: #888; font-size: 13px; margin: 8px 0; }
  #inputbar { display: flex; padding: 8px; border-top: 1px solid #ddd; gap: 6px;
              align-items: center; }
  #inputbar input[type=text] { flex: 1; padding: 10px; border: 1px solid #ccc;
                                border-radius: 20px; font-size: 15px; outline: none; }
  #inputbar button { padding: 10px 16px; border: 0; background: #0084ff; color: #fff;
                     border-radius: 20px; cursor: pointer; font-size: 15px; }
  #fileBtn { background: #e4e6eb; color: #333; padding: 10px 14px; border-radius: 50%;
             cursor: pointer; font-size: 18px; user-select: none; }
  #fileInput { display: none; }
</style>
</head>
<body>
<div id="login">
  <h2>💬 แชทกับแอดมิน</h2>
  <input id="nameInput" placeholder="ใส่ชื่อของคุณ" maxlength="30">
  <button onclick="joinChat()">เข้าสู่แชท</button>
</div>

<div id="chat">
  <div id="header">💬 แชทกับแอดมิน</div>
  <div id="messages"></div>
  <div id="inputbar">
    <label id="fileBtn" for="fileInput">📎</label>
    <input id="fileInput" type="file" accept="image/*">
    <input id="msgInput" type="text" placeholder="พิมพ์ข้อความ..." autocomplete="off">
    <button onclick="sendMsg()">ส่ง</button>
  </div>
</div>

<script>
const socket = io();

function joinChat() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return alert('กรุณาใส่ชื่อ');
  socket.emit('friend_join', { name });
  document.getElementById('login').style.display = 'none';
  document.getElementById('chat').style.display = 'flex';
}

function addMsg(content, cls, type = 'text') {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (type === 'image') {
    const img = document.createElement('img');
    img.src = content;
    div.appendChild(img);
  } else {
    div.textContent = content;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function addSys(text) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'sys';
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg) return;
  socket.emit('friend_message', { msg, type: 'text' });
  addMsg(msg, 'me', 'text');
  input.value = '';
  input.focus();
}

document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    alert('รูปใหญ่เกินไป (สูงสุด 5 MB)');
    this.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    const dataUrl = e.target.result;
    socket.emit('friend_message', { msg: dataUrl, type: 'image' });
    addMsg(dataUrl, 'me', 'image');
  };
  reader.readAsDataURL(file);
  this.value = '';
});

socket.on('system', d => addSys(d.msg));
socket.on('from_admin', d => addMsg(d.msg, 'them', d.type || 'text'));

document.getElementById('msgInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') sendMsg();
});
document.getElementById('nameInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') joinChat();
});
</script>
</body>
</html>
